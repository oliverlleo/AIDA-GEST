name: One-time exact hero parallax reference

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-hero-parallax-reference-exact.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Apply exact generated-reference parallax
        shell: bash
        run: python scripts/one_time_hero_parallax_exact.py

      - name: Commit landing update and remove one-time patch files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-hero-parallax-reference-exact.yml
          rm scripts/one_time_hero_parallax_exact.py
          git add landing.html .github/workflows/one-time-hero-parallax-reference-exact.yml scripts/one_time_hero_parallax_exact.py
          git commit -m "style: match hero parallax to generated CentralOS reference"
          git push origin HEAD:design/centralos-brand-responsive-v2
