name: One-time correct static login selector typo
on:
  push:
    branches:
      - fix/github-pages-landing-entry
    paths:
      - .github/workflows/one-time-fix-static-login-css-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-pages-landing-entry
          fetch-depth: 0
      - name: Correct selectors and cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('centralos-mobile-login-firstpaint.css')
          text = css.read_text(encoding='utf-8')
          if '..centralos-login-ref' not in text:
              raise SystemExit('Expected double-dot selector typo not found')
          text = text.replace('..centralos-login-ref', '.centralos-login-ref')
          if '${ROOT}' in text or '..centralos-login-ref' in text:
              raise SystemExit('Static CSS still contains invalid login selectors')
          css.write_text(text, encoding='utf-8')

          app = Path('app.html')
          html = app.read_text(encoding='utf-8')
          html = html.replace('centralos-mobile-login-firstpaint.css?v=2', 'centralos-mobile-login-firstpaint.css?v=3', 1)
          app.write_text(html, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/one-time-fix-static-login-css-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html centralos-mobile-login-firstpaint.css
          git commit -m "fix: make mobile login CSS valid on first paint"
          git push origin HEAD:fix/github-pages-landing-entry