name: Run hero reference v6

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/run-hero-reference-v6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Apply generated-reference parallax patch
        shell: bash
        run: |
          python scripts/one_time_hero_reference_v6.py

      - name: Commit landing update and clean one-time files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/run-hero-reference-v6.yml
          rm -f scripts/one_time_hero_reference_v6.py
          git add landing.html .github/workflows scripts
          git commit -m "style: trace hero parallax from generated CentralOS reference"
          git push origin HEAD:design/centralos-brand-responsive-v2
