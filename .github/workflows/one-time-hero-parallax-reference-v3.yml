name: One-time hero parallax reference v3

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-hero-parallax-reference-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Rebuild hero parallax to match approved reference
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('landing.html')
          s = p.read_text(encoding='utf-8')

          # Remove the previous advanced runtime so it cannot fight the new composition.
          s = re.sub(
              r'<script>\s*/\* advanced parallax only for the hero: layered system network \+ mouse \+ scroll \+ ambient drift \*/.*?</script>\s*',
              '',
              s,
              flags=re.S
          )

          # Make the patch idempotent.
          s = re.sub(r'\n?/\* HERO PARALLAX V3 - MATCH REFERENCE \*/.*?/\* END HERO PARALLAX V3 \*/\n?', '\n', s, flags=re.S)
          s = re.sub(r'<script>\s*/\* HERO PARALLAX V3 RUNTIME \*/.*?</script>\s*', '', s, flags=re.S)

          css = r'''
/* HERO PARALLAX V3 - MATCH REFERENCE */
.hero{
  isolation:isolate;
  perspective:1700px;
  overflow:hidden;
}
.hero>.hero-bg{z-index:0!important}
.hero>.wrap{position:relative;z-index:6}
.hero-system-parallax,.hero-advanced-parallax{display:none!important}

/* Keep the real CentralOS mockup in front of every background plane. */
.hero .command{
  position:relative;
  z-index:9;
  isolation:isolate;
  transform-style:preserve-3d;
  will-change:transform;
}
.hero .os-window{z-index:3}
.hero .float{
  z-index:14!important;
  transform:translateZ(70px);
}
.hero .float.a{z-index:18!important}
.hero .float.b{z-index:18!important}

.hero-parallax-v3{
  position:absolute;
  inset:-10% -5% -14%;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
  transform-style:preserve-3d;
  perspective:1700px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);
}
.hp3-layer{
  position:absolute;
  inset:-7%;
  transform-style:preserve-3d;
  will-change:transform;
}

/* Deep charcoal volume instead of an empty flat black field. */
.hp3-ambient{
  background:
    radial-gradient(circle at 77% 24%,rgba(255,91,0,.15),transparent 19%),
    radial-gradient(circle at 64% 70%,rgba(255,91,0,.085),transparent 24%),
    radial-gradient(circle at 91% 62%,rgba(84,105,130,.09),transparent 25%);
  opacity:.86;
}
.hp3-grid{
  position:absolute;
  inset:-5% -7% -2% 18%;
  opacity:.42;
  background-image:
    linear-gradient(rgba(255,255,255,.037) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.037) 1px,transparent 1px);
  background-size:72px 72px;
  transform:perspective(900px) rotateX(59deg) rotateZ(-3deg) translateY(29%);
  transform-origin:50% 72%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.38) 22%,#000 48%,rgba(0,0,0,.88) 100%);
  mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.38) 22%,#000 48%,rgba(0,0,0,.88) 100%);
}
.hp3-grid:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 14%,rgba(255,91,0,.04) 39%,rgba(255,91,0,.17) 54%,transparent 73%);
  animation:hp3GridSweep 7.5s ease-in-out infinite alternate;
}
@keyframes hp3GridSweep{from{transform:translateX(-22%)}to{transform:translateX(25%)}}

/* Flow graph behind the real product window. */
.hp3-network{position:absolute;inset:3% -3% 0 27%;opacity:.86}
.hp3-network svg{width:100%;height:100%;overflow:visible}
.hp3-wire{fill:none;stroke:rgba(255,255,255,.095);stroke-width:1.15;vector-effect:non-scaling-stroke}
.hp3-wire.hot{stroke:rgba(255,91,0,.34);stroke-dasharray:8 18;animation:hp3Wire 8.5s linear infinite;filter:drop-shadow(0 0 6px rgba(255,91,0,.18))}
.hp3-wire.hot.rev{animation-duration:12s;animation-direction:reverse}
@keyframes hp3Wire{to{stroke-dashoffset:-104}}
.hp3-node{fill:#ff5b00;filter:drop-shadow(0 0 9px #ff5b00);animation:hp3Node 2.8s ease-in-out infinite}
.hp3-node.n2{animation-delay:-.8s}.hp3-node.n3{animation-delay:-1.6s}.hp3-node.n4{animation-delay:-2.2s}
@keyframes hp3Node{0%,100%{opacity:.25;r:2.3px}50%{opacity:1;r:4.2px}}

/* Large UI cards around the viewport, like the approved concept image. */
.hp3-panel{
  position:absolute;
  width:230px;
  min-height:105px;
  padding:18px 18px 16px;
  border:1px solid rgba(255,255,255,.11);
  border-radius:20px;
  background:linear-gradient(145deg,rgba(22,27,34,.78),rgba(8,11,15,.42));
  box-shadow:0 30px 78px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.035),0 0 40px rgba(255,91,0,.018);
  backdrop-filter:blur(12px);
  color:#e8ecf0;
  opacity:.46;
}
.hp3-panel .hp3-icon{
  width:34px;height:34px;border-radius:10px;
  display:inline-grid;place-items:center;
  margin-right:11px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.025);
  color:#9ba4ae;
  font-size:16px;
  vertical-align:middle;
}
.hp3-panel b{font:700 13px Manrope,sans-serif;vertical-align:middle;color:#dce1e6}
.hp3-panel i{
  display:block;height:8px;border-radius:8px;background:#2a3139;margin-top:13px;width:72%;
}
.hp3-panel i:last-child{width:48%;margin-top:8px;opacity:.78}
.hp3-panel:after{
  content:"";position:absolute;left:18px;right:18px;bottom:10px;height:1px;
  background:linear-gradient(90deg,rgba(255,91,0,.7),transparent 68%);
  transform:scaleX(.3);transform-origin:left;opacity:.5;
  animation:hp3PanelLine 4.1s ease-in-out infinite alternate;
}
@keyframes hp3PanelLine{to{transform:scaleX(1);opacity:.82}}
.hp3-p1{left:-2%;top:8%;transform:rotate(-7deg)}
.hp3-p2{left:44%;top:1%;transform:rotate(3deg)}
.hp3-p3{right:-2%;top:9%;transform:rotate(6deg)}
.hp3-p4{left:43%;bottom:1%;transform:rotate(-4deg)}
.hp3-p5{right:-1%;bottom:0;transform:rotate(5deg)}
.hp3-p6{left:8%;bottom:11%;transform:rotate(5deg);opacity:.26}
.hp3-p2,.hp3-p4{opacity:.40}

/* Orange light architecture visible in the reference. */
.hp3-rings{
  position:absolute;
  width:min(860px,64vw);aspect-ratio:1;
  right:-13vw;top:-1%;
  border-radius:50%;opacity:.48;
  background:
    repeating-radial-gradient(circle,transparent 0 58px,rgba(255,255,255,.048) 59px,transparent 60px 93px),
    conic-gradient(from 145deg,transparent 0 13%,rgba(255,91,0,.22) 17%,transparent 23% 51%,rgba(255,91,0,.11) 58%,transparent 64% 100%);
  -webkit-mask-image:radial-gradient(circle,#000 0 50%,rgba(0,0,0,.55) 68%,transparent 79%);
  mask-image:radial-gradient(circle,#000 0 50%,rgba(0,0,0,.55) 68%,transparent 79%);
  animation:hp3Ring 38s linear infinite;
}
@keyframes hp3Ring{to{rotate:360deg}}
.hp3-beam-v{
  position:absolute;top:-12%;bottom:-12%;width:2px;right:20%;opacity:.58;
  background:linear-gradient(180deg,transparent,rgba(255,91,0,.16) 19%,rgba(255,91,0,.92) 49%,rgba(255,91,0,.14) 79%,transparent);
  box-shadow:0 0 19px rgba(255,91,0,.32);
  animation:hp3BeamV 5.8s ease-in-out infinite alternate;
}
@keyframes hp3BeamV{from{transform:translateX(-95px);opacity:.25}to{transform:translateX(110px);opacity:.62}}
.hp3-beam-h{
  position:absolute;left:30%;right:-5%;height:1px;top:36%;opacity:.56;
  background:linear-gradient(90deg,transparent,rgba(255,91,0,.16),rgba(255,91,0,.8),rgba(255,91,0,.1),transparent);
  box-shadow:0 0 15px rgba(255,91,0,.24);
  animation:hp3BeamH 7.2s ease-in-out infinite;
}
@keyframes hp3BeamH{0%,100%{transform:translateY(-16vh);opacity:.18}50%{transform:translateY(43vh);opacity:.58}}
.hp3-dot{
  position:absolute;width:5px;height:5px;border-radius:50%;background:#ff6410;
  box-shadow:0 0 14px rgba(255,91,0,.92);opacity:.66;
  animation:hp3Dot 3.6s ease-in-out infinite;
}
.hp3-dot:nth-child(2n){animation-duration:5s}.hp3-dot:nth-child(3n){animation-delay:-1.8s}
@keyframes hp3Dot{0%,100%{transform:scale(.55);opacity:.2}50%{transform:scale(1.55);opacity:.9}}

/* The left stays readable, while the right keeps the cinematic depth. */
.hp3-vignette{
  position:absolute;inset:0;z-index:8;
  background:
    radial-gradient(ellipse at 69% 46%,transparent 0 20%,rgba(8,10,13,.11) 48%,rgba(8,10,13,.56) 100%),
    linear-gradient(90deg,rgba(8,10,13,.95) 0%,rgba(8,10,13,.83) 29%,rgba(8,10,13,.30) 59%,rgba(8,10,13,.30) 79%,rgba(8,10,13,.60) 100%);
}

@media(max-width:900px){
  .hero-parallax-v3{inset:-3% -28% -8%}
  .hp3-network{left:13%;opacity:.50}
  .hp3-grid{left:2%;right:-45%;opacity:.28}
  .hp3-rings{width:112vw;right:-65vw;opacity:.30}
  .hp3-panel{width:165px;min-height:78px;padding:13px;opacity:.17}
  .hp3-panel .hp3-icon{width:27px;height:27px;font-size:13px}
  .hp3-panel i{height:6px;margin-top:9px}
  .hp3-p1,.hp3-p2,.hp3-p6{display:none}
  .hp3-p3{right:2%;top:11%}.hp3-p4{left:auto;right:41%;bottom:4%}.hp3-p5{right:1%;bottom:1%}
  .hp3-vignette{background:linear-gradient(180deg,rgba(8,10,13,.48),rgba(8,10,13,.68))}
  .hero .float.a{right:0;top:3%;z-index:18!important}
}
@media(prefers-reduced-motion:reduce){
  .hp3-grid:after,.hp3-wire.hot,.hp3-node,.hp3-panel:after,.hp3-rings,.hp3-beam-v,.hp3-beam-h,.hp3-dot{animation:none!important}
}
/* END HERO PARALLAX V3 */
'''

          runtime = r'''
<script>
/* HERO PARALLAX V3 RUNTIME */
(()=>{
  const hero=document.querySelector('.hero');
  if(!hero || hero.querySelector('.hero-parallax-v3')) return;

  hero.querySelectorAll('.hero-system-parallax,.hero-advanced-parallax').forEach(el=>el.remove());

  const root=document.createElement('div');
  root.className='hero-parallax-v3';
  root.setAttribute('aria-hidden','true');
  root.innerHTML=`
    <div class="hp3-layer hp3-ambient" data-depth="0.08"></div>
    <div class="hp3-layer" data-depth="0.14"><div class="hp3-grid"></div></div>
    <div class="hp3-layer" data-depth="0.22">
      <div class="hp3-rings"></div>
      <div class="hp3-network">
        <svg viewBox="0 0 1200 760" preserveAspectRatio="none">
          <path class="hp3-wire" d="M15 142 C180 60 310 225 470 158 S810 78 1170 180"/>
          <path class="hp3-wire hot" d="M15 142 C180 60 310 225 470 158 S810 78 1170 180"/>
          <path class="hp3-wire" d="M70 545 C275 390 385 600 610 456 S910 388 1180 548"/>
          <path class="hp3-wire hot rev" d="M70 545 C275 390 385 600 610 456 S910 388 1180 548"/>
          <path class="hp3-wire" d="M248 52 C330 222 272 344 492 418 S820 438 970 725"/>
          <path class="hp3-wire hot" d="M248 52 C330 222 272 344 492 418 S820 438 970 725"/>
          <path class="hp3-wire" d="M1020 28 C812 180 882 302 674 358 S338 342 122 718"/>
          <path class="hp3-wire hot rev" d="M1020 28 C812 180 882 302 674 358 S338 342 122 718"/>
          <circle class="hp3-node" cx="470" cy="158" r="3"/>
          <circle class="hp3-node n2" cx="610" cy="456" r="3"/>
          <circle class="hp3-node n3" cx="492" cy="418" r="3"/>
          <circle class="hp3-node n4" cx="882" cy="302" r="3"/>
        </svg>
      </div>
    </div>
    <div class="hp3-layer" data-depth="0.34">
      <div class="hp3-panel hp3-p1"><span class="hp3-icon">◎</span><b>Cliente</b><i></i><i></i></div>
      <div class="hp3-panel hp3-p2"><span class="hp3-icon">⌁</span><b>Orçamento</b><i></i><i></i></div>
      <div class="hp3-panel hp3-p3"><span class="hp3-icon">◷</span><b>Prazo</b><i></i><i></i></div>
      <div class="hp3-panel hp3-p4"><span class="hp3-icon">⚙</span><b>Peças</b><i></i><i></i></div>
      <div class="hp3-panel hp3-p5"><span class="hp3-icon">◇</span><b>Entrega</b><i></i><i></i></div>
      <div class="hp3-panel hp3-p6"><span class="hp3-icon">↺</span><b>Garantia</b><i></i><i></i></div>
    </div>
    <div class="hp3-layer" data-depth="0.48">
      <div class="hp3-beam-v"></div><div class="hp3-beam-h"></div>
      <i class="hp3-dot" style="left:34%;top:15%"></i>
      <i class="hp3-dot" style="left:46%;top:36%"></i>
      <i class="hp3-dot" style="left:58%;top:13%"></i>
      <i class="hp3-dot" style="left:70%;top:47%"></i>
      <i class="hp3-dot" style="left:82%;top:25%"></i>
      <i class="hp3-dot" style="left:91%;top:63%"></i>
      <i class="hp3-dot" style="left:56%;top:76%"></i>
      <i class="hp3-dot" style="left:74%;top:85%"></i>
    </div>
    <div class="hp3-vignette"></div>`;

  const bg=hero.querySelector('.hero-bg');
  if(bg && bg.nextSibling) hero.insertBefore(root,bg.nextSibling); else hero.prepend(root);

  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced) return;

  const layers=[...root.querySelectorAll('.hp3-layer')];
  const command=hero.querySelector('.command');
  let tx=0,ty=0,mx=0,my=0,scroll=0,targetScroll=0,last=performance.now();

  const readScroll=()=>{
    const r=hero.getBoundingClientRect();
    const vh=innerHeight||1;
    targetScroll=Math.max(-1.1,Math.min(1.1,(vh*.48-r.top)/vh));
  };
  readScroll();

  hero.addEventListener('pointermove',e=>{
    const r=hero.getBoundingClientRect();
    tx=((e.clientX-r.left)/r.width-.5)*2;
    ty=((e.clientY-r.top)/r.height-.5)*2;
  },{passive:true});
  hero.addEventListener('pointerleave',()=>{tx=0;ty=0},{passive:true});
  addEventListener('scroll',readScroll,{passive:true});
  addEventListener('resize',readScroll,{passive:true});

  const frame=now=>{
    const dt=Math.min(42,now-last);last=now;
    const ease=1-Math.pow(.002,dt/1000);
    mx+=(tx-mx)*ease;
    my+=(ty-my)*ease;
    scroll+=(targetScroll-scroll)*ease;

    layers.forEach((layer,i)=>{
      const d=Number(layer.dataset.depth||.2);
      const driftX=Math.sin(now*.00023+i*1.71)*5*d;
      const driftY=Math.cos(now*.00019+i*1.27)*4*d;
      const x=mx*58*d+driftX;
      const y=my*34*d-scroll*116*d+driftY;
      const z=d*110;
      const rz=mx*(i-1.4)*.24;
      layer.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateZ(${rz}deg)`;
    });

    if(command){
      command.style.transform=`translate3d(${mx*8}px,${my*5-scroll*11}px,0)`;
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
'''

          s = s.replace('</style>', css + '\n</style>', 1)
          s = s.replace('</body>', runtime + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          s=Path('landing.html').read_text(encoding='utf-8')
          assert 'HERO PARALLAX V3 - MATCH REFERENCE' in s
          assert 'hero-parallax-v3' in s
          assert 'hp3-panel hp3-p3' in s
          assert '.hero .float.a{z-index:18!important}' in s
          assert 'advanced parallax only for the hero: layered system network + mouse + scroll + ambient drift' not in s
          print('hero parallax v3 validation ok')
          PY

      - name: Commit landing update and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-hero-parallax-reference-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing.html .github/workflows/one-time-hero-parallax-reference-v3.yml
          git commit -m "style: match hero parallax to approved cinematic reference"
          git push origin HEAD:design/centralos-brand-responsive-v2
