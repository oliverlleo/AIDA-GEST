name: One-time hero parallax reference v3

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-hero-parallax-reference-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Rebuild hero parallax to match approved reference
        run: python .github/scripts/hero_parallax_reference_v3_patch.py

      - name: Commit landing update and remove one-time patch files
        run: |
          rm -f .github/workflows/one-time-hero-parallax-reference-v3.yml
          rm -f .github/scripts/hero_parallax_reference_v3_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing.html .github/workflows/one-time-hero-parallax-reference-v3.yml .github/scripts/hero_parallax_reference_v3_patch.py
          git commit -m "style: match hero parallax to approved cinematic reference"
          git push origin HEAD:design/centralos-brand-responsive-v2
