name: One-time hero system parallax

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-hero-system-parallax.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Add hero system parallax
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode('  siXG48L2JvZHk+IiwgMSkKcC53cml0ZV90ZXh0KHMsZW5jb2Rpbmc9InV0Zi04IikK').decode())"

      - name: Commit landing update and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-hero-system-parallax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing.html .github/workflows/one-time-hero-system-parallax.yml
          git commit -m "style: add system parallax depth to hero only"
          git push origin HEAD:design/centralos-brand-responsive-v2
