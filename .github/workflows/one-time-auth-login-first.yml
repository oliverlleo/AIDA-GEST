name: One-time login-first auth shell
on:
  push:
    branches:
      - fix/github-pages-landing-entry
    paths:
      - .github/workflows/one-time-auth-login-first.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-pages-landing-entry
          fetch-depth: 0
      - name: Make login the default visible shell
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('app.html')
          html = app.read_text(encoding='utf-8')

          # Remove the artificial full-screen validation shield completely.
          css_start = html.find('        #auth-boot-shield {')
          css_end_marker = '        html.auth-resolved #auth-boot-shield { display: none !important; }\n'
          if css_start != -1:
              css_end = html.find(css_end_marker, css_start)
              if css_end == -1:
                  raise SystemExit('auth shield CSS end not found')
              css_end += len(css_end_marker)
              html = html[:css_start] + html[css_end:]

          shield_start = html.find('    <div id="auth-boot-shield" aria-hidden="true">')
          if shield_start != -1:
              shield_end_marker = '    </div>\n\n    <!-- Loading Overlay -->'
              shield_end = html.find(shield_end_marker, shield_start)
              if shield_end == -1:
                  raise SystemExit('auth shield HTML end not found')
              html = html[:shield_start] + '    <!-- Loading Overlay -->' + html[shield_end + len(shield_end_marker):]

          # Login must be physically visible in the raw HTML before Alpine runs.
          old_login = '<div x-show="authResolved && !session && !employeeSession && !registrationSuccess && view !== \'setup_required\'" class="fixed inset-0 bg-white z-[10000] overflow-y-auto" x-cloak>'
          new_login = '<div x-show="!session && !employeeSession && !registrationSuccess && view !== \'setup_required\'" class="fixed inset-0 bg-white z-[10000] overflow-y-auto">'
          if old_login not in html:
              # tolerate a prior partial state
              old_login = '<div x-show="!session && !employeeSession && !registrationSuccess && view !== \'setup_required\'" class="fixed inset-0 bg-white z-[10000] overflow-y-auto" x-cloak>'
          if old_login not in html:
              raise SystemExit('login overlay anchor not found')
          html = html.replace(old_login, new_login)

          app.write_text(html, encoding='utf-8')

          main = Path('js/main.js')
          js = main.read_text(encoding='utf-8')

          # authResolved is no longer needed for presentation. Session logic remains untouched.
          js = js.replace('        authResolved: false,\n', '', 1)
          js = js.replace("                this.authResolved = true;\n                document.documentElement.classList.add('auth-resolved');\n", '', 1)
          main.write_text(js, encoding='utf-8')

          # Verification
          html_check = app.read_text(encoding='utf-8')
          js_check = main.read_text(encoding='utf-8')
          assert 'auth-boot-shield' not in html_check
          assert 'Verificando acesso...' not in html_check
          assert 'x-show="!session && !employeeSession && !registrationSuccess' in html_check
          assert 'z-[10000] overflow-y-auto">' in html_check
          assert 'z-[10000] overflow-y-auto" x-cloak>' not in html_check
          assert 'authResolved: false' not in js_check
          assert "classList.add('auth-resolved')" not in js_check
          PY
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-auth-login-first.yml
          git add app.html js/main.js .github/workflows/one-time-auth-login-first.yml
          git commit -m "fix: show login immediately and keep app hidden for anonymous users"
          git push origin HEAD:fix/github-pages-landing-entry
