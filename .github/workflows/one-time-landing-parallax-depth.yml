name: One-time landing parallax depth

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-landing-parallax-depth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Add selective parallax depth
        shell: python
        run: |
          from pathlib import Path

          p = Path('landing.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* selective dark-section parallax depth */'
          if marker in s:
              raise SystemExit('Selective parallax depth already present')

          css = r'''
/* selective dark-section parallax depth */
.problem,.roles,.system-map{
  position:relative;
  isolation:isolate;
  --parallax-y:0px;
  --parallax-y-rev:0px;
  --parallax-x:0px;
}
.problem>.wrap,.roles>.wrap,.system-map>.wrap{
  position:relative;
  z-index:2;
}

/* 1) PROBLEMA — usa a textura arquitetônica da marca, bem discreta */
.problem::before{
  content:"";
  position:absolute;
  z-index:0;
  width:min(760px,58vw);
  height:118%;
  right:-7vw;
  top:-9%;
  pointer-events:none;
  opacity:.16;
  background:
    linear-gradient(90deg,rgba(8,10,13,0) 0%,rgba(8,10,13,.05) 34%,rgba(8,10,13,.28) 100%),
    url('backgorundlogin.png') 66% 50%/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.45) 22%,#000 55%,#000 100%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.45) 22%,#000 55%,#000 100%);
  transform:translate3d(var(--parallax-x),var(--parallax-y),0) scale(1.07);
  will-change:transform;
}
.problem::after{
  content:"";
  position:absolute;
  z-index:1;
  width:520px;
  height:520px;
  right:-180px;
  top:12%;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,91,0,.12) 0%,rgba(255,91,0,.045) 31%,transparent 69%);
  filter:blur(8px);
  transform:translate3d(calc(var(--parallax-x) * -.45),var(--parallax-y-rev),0);
  will-change:transform;
}

/* 2) EQUIPE — mantém o foco na esfera, mas dá profundidade ao vazio */
.roles::before{
  content:"";
  position:absolute;
  inset:-14% -8%;
  z-index:0;
  pointer-events:none;
  opacity:.38;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    radial-gradient(circle at 73% 46%,rgba(255,91,0,.11),transparent 26%);
  background-size:72px 72px,72px 72px,100% 100%;
  -webkit-mask-image:radial-gradient(circle at 72% 48%,#000 0%,rgba(0,0,0,.75) 34%,transparent 72%);
  mask-image:radial-gradient(circle at 72% 48%,#000 0%,rgba(0,0,0,.75) 34%,transparent 72%);
  transform:translate3d(calc(var(--parallax-x) * .35),var(--parallax-y-rev),0) scale(1.04);
  will-change:transform;
}
.roles::after{
  content:"";
  position:absolute;
  z-index:0;
  width:min(720px,58vw);
  aspect-ratio:1;
  right:-17vw;
  top:3%;
  border:1px solid rgba(255,91,0,.11);
  border-radius:50%;
  pointer-events:none;
  box-shadow:
    0 0 0 76px rgba(255,255,255,.012),
    0 0 0 150px rgba(255,91,0,.018);
  transform:translate3d(calc(var(--parallax-x) * -.6),var(--parallax-y),0);
  will-change:transform;
}

/* 3) MAPA — um campo técnico discreto; sem repetir a mesma imagem */
.system-map::before{
  content:"";
  position:absolute;
  z-index:0;
  width:760px;
  height:760px;
  left:-300px;
  top:5%;
  border-radius:50%;
  pointer-events:none;
  opacity:.75;
  background:
    repeating-radial-gradient(circle at center,rgba(255,255,255,.038) 0 1px,transparent 1px 54px),
    conic-gradient(from 120deg,transparent 0 18%,rgba(255,91,0,.075) 24%,transparent 31% 68%,rgba(255,91,0,.045) 74%,transparent 82%);
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.65) 48%,transparent 73%);
  mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.65) 48%,transparent 73%);
  transform:translate3d(calc(var(--parallax-x) * -.25),var(--parallax-y),0) rotate(-7deg);
  will-change:transform;
}
.system-map::after{
  content:"CENTRAL / OS";
  position:absolute;
  z-index:0;
  right:-.04em;
  bottom:1.5%;
  pointer-events:none;
  font:900 clamp(86px,15vw,245px)/.75 Manrope,sans-serif;
  letter-spacing:-.075em;
  color:rgba(255,255,255,.018);
  white-space:nowrap;
  transform:translate3d(calc(var(--parallax-x) * .2),var(--parallax-y-rev),0);
  will-change:transform;
}

@media(max-width:767px){
  .problem::before{width:118vw;right:-62vw;opacity:.10}
  .problem::after{width:360px;height:360px;right:-220px;opacity:.7}
  .roles::before{opacity:.24;background-size:54px 54px,54px 54px,100% 100%}
  .roles::after{width:110vw;right:-72vw;opacity:.55}
  .system-map::before{width:520px;height:520px;left:-330px;opacity:.42}
  .system-map::after{font-size:28vw;opacity:.65}
}

@media(prefers-reduced-motion:reduce){
  .problem,.roles,.system-map{
    --parallax-y:0px!important;
    --parallax-y-rev:0px!important;
    --parallax-x:0px!important;
  }
}
'''

          if '</style>' not in s:
              raise SystemExit('style closing tag not found')
          s = s.replace('</style>', css + '\n</style>', 1)

          js = r'''
<script>
/* selective dark-section parallax: only three intentionally sparse sections */
(()=>{
  const sections=[...document.querySelectorAll('.problem,.roles,.system-map')];
  if(!sections.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let raf=0;
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));

  const paint=()=>{
    const vh=innerHeight || 1;
    sections.forEach((el,index)=>{
      const r=el.getBoundingClientRect();
      const center=r.top+r.height*.5;
      const normalized=clamp((center-vh*.5)/(vh+r.height),-1,1);
      const strength=index===0?64:index===1?42:54;
      const y=-normalized*strength;
      el.style.setProperty('--parallax-y',`${y.toFixed(2)}px`);
      el.style.setProperty('--parallax-y-rev',`${(-y*.58).toFixed(2)}px`);
    });
    raf=0;
  };

  const requestPaint=()=>{ if(!raf) raf=requestAnimationFrame(paint); };
  addEventListener('scroll',requestPaint,{passive:true});
  addEventListener('resize',requestPaint,{passive:true});

  sections.forEach(el=>{
    el.addEventListener('pointermove',e=>{
      if(innerWidth<900) return;
      const r=el.getBoundingClientRect();
      const x=clamp((e.clientX-r.left)/r.width-.5,-.5,.5)*22;
      el.style.setProperty('--parallax-x',`${x.toFixed(2)}px`);
    },{passive:true});
    el.addEventListener('pointerleave',()=>el.style.setProperty('--parallax-x','0px'),{passive:true});
  });

  paint();
})();
</script>
'''

          if '</body>' not in s:
              raise SystemExit('body closing tag not found')
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit landing update and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-landing-parallax-depth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing.html .github/workflows/one-time-landing-parallax-depth.yml
          git commit -m "style: add selective parallax depth to dark landing sections"
          git push origin HEAD:design/centralos-brand-responsive-v2
