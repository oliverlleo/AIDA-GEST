name: One-time landing parallax depth

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-landing-parallax-depth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Add selective parallax depth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('landing.html')
          s=p.read_text(encoding='utf-8')
          marker='/* selective dark-section parallax depth */'
          if marker in s:
              raise SystemExit('Selective parallax depth already present')
          css=base64.b64decode('').decode('utf-8')
          js=base64.b64decode('').decode('utf-8')
          if '</style>' not in s or '</body>' not in s:
              raise SystemExit('landing anchors not found')
          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit landing update and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-landing-parallax-depth.yml
          rm -f .tmp-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing.html .github/workflows/one-time-landing-parallax-depth.yml
          git add -u
          git commit -m "style: add selective parallax depth to dark landing sections"
          git push origin HEAD:design/centralos-brand-responsive-v2
