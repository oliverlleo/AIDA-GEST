name: One-time static login first-paint CSS fix
on:
  push:
    branches:
      - fix/github-pages-landing-entry
    paths:
      - .github/workflows/one-time-fix-static-login-css.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-pages-landing-entry
          fetch-depth: 0
      - name: Fix static login CSS selectors
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('centralos-mobile-login-firstpaint.css')
          text = css.read_text(encoding='utf-8')
          broken = '${ROOT}'
          if broken not in text:
              raise SystemExit('Expected broken ${ROOT} selectors were not found')
          text = text.replace(broken, '.centralos-login-ref')
          css.write_text(text, encoding='utf-8')

          app = Path('app.html')
          html = app.read_text(encoding='utf-8')
          old = 'centralos-mobile-login-firstpaint.css?v=1'
          new = 'centralos-mobile-login-firstpaint.css?v=2'
          if old not in html:
              raise SystemExit('Expected first-paint stylesheet link was not found')
          app.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/one-time-fix-static-login-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html centralos-mobile-login-firstpaint.css
          git commit -m "fix: eliminate mobile login first-paint layout flash"
          git push origin HEAD:fix/github-pages-landing-entry