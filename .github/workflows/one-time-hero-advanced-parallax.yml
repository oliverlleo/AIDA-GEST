name: One-time hero advanced parallax

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-hero-advanced-parallax.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Replace simplified hero parallax with layered operational depth
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode('  e29wYWNpdHk6LjIyO3I6Mi40cHh9NTAl     ').decode())"

      - name: Commit landing update and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-hero-advanced-parallax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing.html .github/workflows/one-time-hero-advanced-parallax.yml
          git commit -m "style: replace hero parallax with layered operational depth"
          git push origin HEAD:design/centralos-brand-responsive-v2
