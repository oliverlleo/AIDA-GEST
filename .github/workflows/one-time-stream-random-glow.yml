name: One-time stream random glow

on:
  push:
    branches:
      - design/centralos-brand-responsive-v2
    paths:
      - .github/workflows/one-time-stream-random-glow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/centralos-brand-responsive-v2
          fetch-depth: 0

      - name: Add random orange glow without changing marquee motion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p=Path('landing.html')
          s=p.read_text(encoding='utf-8')
          marker='/* random orange pulse for moving feature cards */'
          if marker in s:
              raise SystemExit('Random stream glow already present')

          css=base64.b64decode('').decode('utf-8')
          js=base64.b64decode('').decode('utf-8')

          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit landing update and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-stream-random-glow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing.html .github/workflows/one-time-stream-random-glow.yml
          git commit -m "style: add random orange highlights to moving feature cards"
          git push origin HEAD:design/centralos-brand-responsive-v2
