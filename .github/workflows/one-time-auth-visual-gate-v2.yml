name: One-time auth visual gate v2
on:
  push:
    branches:
      - fix/github-pages-landing-entry
    paths:
      - .github/workflows/one-time-auth-visual-gate-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-pages-landing-entry
          fetch-depth: 0
      - name: Apply hard visual auth gate
        run: python scripts/one_time_auth_visual_gate_v2.py
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-auth-visual-gate-v2.yml
          rm -f scripts/one_time_auth_visual_gate_v2.py
          git add app.html js/main.js .github/workflows/one-time-auth-visual-gate-v2.yml scripts/one_time_auth_visual_gate_v2.py
          git commit -m "fix: fully cover app until authentication is resolved"
          git push origin HEAD:fix/github-pages-landing-entry
